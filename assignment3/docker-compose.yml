services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      mongosh --host mongo:27017 --quiet --eval "try { rs.status().ok } catch(e) { rs.initiate({_id: \"rs0\", members:[{_id:0,host:\"mongo:27017\"}]}) }";
      until mongosh --host mongo:27017 --quiet --eval "db.hello().isWritablePrimary" | grep -q true; do sleep 2; done;
      echo "MongoDB replica set is ready."
    restart: "no"
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["sh", "-lc", "node src/migrate.js && node src/seed.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/finops?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    restart: "no"
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/finops?replicaSet=rs0
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  test:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["sh", "-lc", "TEST_MONGO_URI=mongodb://mongo:27017/finops_test?replicaSet=rs0 npm test"]
    environment:
      MONGO_URI: mongodb://mongo:27017/finops_test?replicaSet=rs0
      TEST_MONGO_URI: mongodb://mongo:27017/finops_test?replicaSet=rs0
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    profiles: ["test"]
    restart: "no"
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  mongo_data:
